<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="contar()">Contar</button> <button onclick="apagar()">Apagar</button>

    <div id="div_exibir"></div>
</body>
</html>
<script>


function contar() {

    let contador = 0
    let contador10 = 0
    while(contador <= contador10 && contador <= 100 ) {
        
        div_exibir.innerHTML += `${contador}`
        contador += 1
        contador10 += 10
    }

}

function apagar() {
    div_exibir.innerHTML = ``
}



</script>
