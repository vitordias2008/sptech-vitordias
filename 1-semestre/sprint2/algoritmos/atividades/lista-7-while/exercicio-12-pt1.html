<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 12</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">12. Papagaio Repetitivo</h1>

    <span>Digite um número:</span>
    <input type="text" id="ipt_numero"><br>

    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase"><br>

    <button class="button" onclick="papagaioRepetitivo()">Papagaio Repetitivo</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function papagaioRepetitivo() {
        let numero = Number(ipt_numero.value)
        let frase = ipt_frase.value
        let contador = 1
        let repeticao = ""

        div_exibir.innerHTML = ""

        while (contador <= numero) {
            repeticao += `${frase} `

            div_exibir.innerHTML += `${contador} - ${repeticao}<br>`

            contador += 1
        }
    }
</script>
