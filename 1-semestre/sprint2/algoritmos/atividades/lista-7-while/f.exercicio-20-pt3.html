<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 20 - pt3</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">20. Soma dos Pares</h1>

    <span>Insira um numero:</span>
    <input type="text" id="ipt_numero"><br>
    <span>(Entre 10 e 500)</span> <br><br>

    <button class="button" onclick="somarPares()">Somar pares</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function somarPares() {
        let numero = Number(ipt_numero.value)
        let contador = 0
        let mensagem = ``
        let soma = 0

        if (numero >= 10 && numero <= 500){

            while (contador <= numero) {
                contador += 1

                if (contador % 2 == 0) {
                    mensagem += `<br> ${contador} <br> `
                    soma += contador
                }

            }
                mensagem += `<br> A soma dos numeros pares é: ${soma}`
                div_exibir.innerHTML = mensagem


        } else {
            div_exibir.innerHTML = `<span class="erro">Valores inválidos!</span>`
        }
    }
</script>
