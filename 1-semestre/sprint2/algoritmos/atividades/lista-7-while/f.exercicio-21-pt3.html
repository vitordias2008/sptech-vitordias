<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 20 - pt3</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">21. Contagem dos Múltiplos</h1>

    <span>Insira um limite:</span>
    <input type="text" id="ipt_limite"><br>
    <span>Insira um divisor:</span>
    <input type="text" id="ipt_divisor"><br>
    

    <button class="button" onclick="somarDivisores()">Somar Divisores</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function somarDivisores() {
        let limite = Number(ipt_limite.value)
        let divisor = Number(ipt_divisor.value)
        let contador = 0
        let soma = 0
        let mensagem = ``

        if (limite >= 0) {

            while (contador <= limite) {
                contador += 1

                if (contador % divisor == 0) {
                    mensagem += `<br> ${contador} <br> `
                    soma += contador
                }

            }
                mensagem += `<br> A soma dos Multiplos é: ${soma}`
                div_exibir.innerHTML = mensagem


        } else {
            div_exibir.innerHTML = `<span class="erro">Valores inválidos!</span>`
        }
    }
</script>
