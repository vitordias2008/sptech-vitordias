<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 10</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">10. Pares no Intervalo</h1>

    <span>Início do intervalo:</span>
    <input type="text" id="ipt_inicio"><br>

    <span>Fim do intervalo:</span>
    <input type="text" id="ipt_fim"><br>

    <button class="button" onclick="pares()">S2 Pares</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function pares() {
        let inicio = Number(ipt_inicio.value)
        let fim = Number(ipt_fim.value)
        let contador = inicio

        div_exibir.innerHTML = ""

        if (inicio < fim) {

            while (contador <= fim) {

                if (contador % 2 == 0) {
                    div_exibir.innerHTML += `${contador}<br>`
                }

                contador += 1
            }

        } else {
            div_exibir.innerHTML = `<span class="erro">O intervalo deve ser crescente!</span>`
        }
    }
</script>
