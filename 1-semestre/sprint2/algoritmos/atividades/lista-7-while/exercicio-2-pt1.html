<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 2</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">2. Frase Repetitiva</h1>

    <button class="button" onclick="mostrar()">Diga algo sobre a matéria de Algoritmos</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function mostrar() {
        let contador = 1
        let frase = "Algoritmos é minha matéria favorita"

        div_exibir.innerHTML = ""

        while (contador <= 7) {
            div_exibir.innerHTML += `${frase}<br>`
            contador += 1
        }
    }
</script>
