<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 7</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">7. S2 Pares</h1>

    <button class="button" onclick="contarPar()">S2 Pares</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function contarPar() {
        let contador = 0

        div_exibir.innerHTML = ""

        while (contador <= 100) {

            if (contador % 2 == 0) {
                div_exibir.innerHTML += `${contador}<br>`
            }

            contador += 1
        }
    }
</script>
