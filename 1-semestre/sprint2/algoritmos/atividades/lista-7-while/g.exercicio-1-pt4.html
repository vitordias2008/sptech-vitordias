<body class="body">
    <h1 class="h1">1 - Divisão por subtrações sucessivas.</h1>

    <span>Insira um numero:</span>

    <span>Insira outro numero:</span> 
    <input type="text" id="ipt_numero2"><br>

    <button class="button" onclick="divisaoPorSubtracao()">Divisão Por Subtração</button>

    <div class="button" id="div_exibir"></div>

<script>
    function divisaoPorSubtracao() {

        let numero1 = Number(ipt_numero.value)
        let numero2 = Number(ipt_numero2.value)
        let mensagem = ``
        let quociente = 0
        

        
        while (numero1 >= numero2) {
            
            quociente += 1
            numero1 -= numero2
            resto = numero1

            
            
            

        mensagem = `Quociente da divisão: ${quociente} <br>
                    Resto da divisão: ${resto}`
        }

        

        div_exibir.innerHTML = mensagem
            
        }
    

    



    
</script>
