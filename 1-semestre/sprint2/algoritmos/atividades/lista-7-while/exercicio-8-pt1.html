<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 8</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">8. Múltiplos de 5</h1>

    <span>Digite um número entre 20 e 100:</span>
    <input type="text" id="ipt_numero"><br>

    <button class="button" onclick="multiplos()">Adoro múltiplos de 5</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function multiplos() {
        let numero = Number(ipt_numero.value)
        let contador = 5

        div_exibir.innerHTML = ""

        if (numero >= 20 && numero <= 100) {

            while (contador <= numero) {
                div_exibir.innerHTML += `${contador}<br>`
                contador += 5
            }

        } else {
            div_exibir.innerHTML = `<span class="erro">Número inválido!</span>`
        }
    }
</script>
