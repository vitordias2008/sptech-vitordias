<head>

    <style>
        body {
            font-family: Arial;

            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;

</head>
<body class="body">
    <h1 class="h1">16. Treino de Musculação</h1>

    <span>Quantos dias você faz musculação</span>
    <input type="text" id="ipt_musculacao"><br>

    <button class="button" onclick="rotinaMensal()">Exibir rotina mensal!</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function rotinaMensal() {
        let musculacao = Number(ipt_musculacao.value)
        let contador = musculacao 
        let dias = 0
        let mensagem = ''

            while (dias < 30) {
                dias += 1
                if (contador == musculacao) {
                    mensagem += `Dia ${dias} - Musculação <br>`
                    contador = 1 
                } else {
                    mensagem += `Dia ${dias} - Comer, dormir etc <br>`                     
                    contador += 1
                }
                

            }

            div_exibir.innerHTML = mensagem

        
        }
    
</script>
