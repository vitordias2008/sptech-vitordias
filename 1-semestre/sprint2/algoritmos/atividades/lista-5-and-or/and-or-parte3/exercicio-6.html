<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Desempenho Escolar: O Aluno Foi Aprovado?</h1>

    <div>
      <span style="width: 80px; background-color: white; display: inline-block">
        nota:
      </span>
      <input type="text" id="ipt_nota" />
      <br />

      <span style="width: 80px; background-color: white; display: inline-block">
        frequência:
      </span>
      <input type="text" id="ipt_frequencia" />
      <br />
      
      <button onclick="analisar()">Analisar aluno</button>

      <br /><br />

      <div id="div_exibir"></div>
    </div>
  </body>
</html>

<script>
  function analisar() {
    let nota = Number(ipt_nota.value);
    let frequencia = Number(ipt_frequencia.value);

    if (nota < 0 || nota > 10) {
      alert("Onde já se viu nota <0 ou >10?!");
      div_exibir.innerHTML = ``;
    } else if (frequencia < 0 || frequencia > 100) {
      alert("Onde já se viu frequência <0 ou >100?!");
      div_exibir.innerHTML = ``;
    } else {
      if (nota < 6) {
        div_exibir.innerHTML = `Aluno ficou abaixo da média <br>`;
      } else if (nota <= 8) {
        div_exibir.innerHTML = `Aluno ficou na média <br>`;
      } else {
        div_exibir.innerHTML = `Aluno acima da média <br>`;
      }

      if (frequencia >= 75) {
        div_exibir.innerHTML += `Aluno aprovado por frequência`;
      } else {
        div_exibir.innerHTML += `Aluno reprovado por frequência`;
      }
    }
  }
</script>
