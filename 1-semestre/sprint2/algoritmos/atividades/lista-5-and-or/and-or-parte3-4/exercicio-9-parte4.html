<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Acesso à Academia 24 Horas</h1>

    <span>Plano do aluno:</span>
    <select id="select_plano">
      <option disabled selected>Selecione:</option>
      <option value="premium">Premium</option>
      <option value="basico">Básico</option>
    </select>
    <br />

    <span>Hora atual:</span>
    <input type="text" id="ipt_hora" /> <br />

    <span>O check-in biométrico foi validado?</span>
    <select id="select_checkin">
      <option disabled selected>Selecione:</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>
    <br /><br />

    <button onclick="liberar()">Liberar catraca</button>
  </body>
</html>

<script>
  function liberar() {
    let plano = select_plano.value;
    let hora = Number(ipt_hora.value);
    let checkin = select_checkin.value;

    if (
      (plano == "premium" || (plano == "basico" && hora >= 6 && hora <= 22)) &&
      checkin == "sim"
    ) {
      alert('Acesso liberado');
    } else {
      alert('Acesso negado');
    }
  }
</script>
