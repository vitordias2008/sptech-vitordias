<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEVADOR</title>
    <link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/2696_fe0f/512.webp">
</head>
<body style="text-align: center;">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/2696_fe0f/512.webp" alt="Peso" style="width: 200px; height: 200px;">
    <h1 style = "background-color: gray; color: white; font-size: 30px;">CONTROLE DE PESO NO ELEVADOR</H1>

<span style="color: gray; width: max-content; height: max-content; font-size: 150% ">Quantidade de homens:</span>
<input type="text" id="ipt_homens" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<span style="color: gray; width: max-content; height: max-content; font-size: 150% ">Quantidade de mulheres:</span>
<input type="text" id="ipt_mulheres" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<button onclick="analisar_peso()" style="width: max-content; height: max-content; font-size: 250%;">Analisar peso</button>
<br><br><br>
<div id="div_exibir" style="font-size: 40px"></div>

<script>

function analisar_peso(){

let homens = Number(ipt_homens.value)
let mulheres = Number(ipt_mulheres.value)
let peso = homens * 80 + mulheres * 60

if (peso > 800){
    div_exibir.innerHTML = `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${peso}kg <br> <span style="color: blue;">Será necessário que alguém desça para que o elevador se movimente</span>`
} else{
    div_exibir.innerHTML = `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${peso}kg`
}
}





</script>




</body>
</html>
