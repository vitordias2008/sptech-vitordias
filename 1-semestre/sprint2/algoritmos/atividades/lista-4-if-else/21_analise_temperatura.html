<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPERATURA</title>
    <link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f321_fe0f/512.webp">
</head>
<body style="text-align: center;">
    <h1 style = "background-color: red; color: white; font-size: 30px;">ANÁLISE DE TEMPERATURA</H1>

<span style="color: red; width: max-content; height: max-content; font-size: 150% ">Temperatura do ambiente:</span>
<input type="text" id="ipt_temperatura" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<button onclick="verificar_clima()" style="width: max-content; height: max-content; font-size: 250%;">Verificar clima</button>
<br><br><br>
<div id="div_exibir" style="font-size: 40px"></div>

<script>

function verificar_clima(){

let temperatura = Number(ipt_temperatura.value)

if (temperatura < 10){
    div_exibir.innerHTML = `Apropriada p/ conservar alimento <br> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJTpjo5asu9My3vOZf2uL5ChoSVPzoQBnfNrgxzeYt3A&s=10" style="width: 200px; height: 200px;">`
} else{
    div_exibir.innerHTML = `Inapropriada p/ conservar alimento <br> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMsY5UT3dcfNnxIpBSl1JzMB9aKAV7mpEcA72X5rbhvw&s=10" style="width: 200px; height: 200px;">`
}
}





</script>




</body>
</html>
