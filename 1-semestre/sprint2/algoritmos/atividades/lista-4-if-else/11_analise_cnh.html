<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNH</title>
    <link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f697/512.webp">
</head>
<body style="text-align: center;">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f697/512.webp" alt="Carro" style="width: 200px; height: 200px;">
    <h1 style = "background-color: darkblue; color: white; font-size: 30px;">ANÁLISE CNH</H1>

<span style="color: blue; width: max-content; height: max-content; font-size: 150% ">Insira seu nome:</span>
<input type="text" id="ipt_nome" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<span style="color: red; width: max-content; height: max-content; font-size: 150% ">Insira sua idade:</span>
<input type="text" id="ipt_idade" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<button onclick="avaliar_aluno()" style="width: max-content; height: max-content; font-size: 250%;">Avaliar aluno</button>
<br><br><br>
<div id="div_exibir" style="font-size: 40px"></div>

<script>

function avaliar_aluno(){

let nome = ipt_nome.value
let idade = Number(ipt_idade.value)

if (idade >= 18){
    div_exibir.innerHTML = `${nome}, vamos tirar a CNH?`
} else{
    div_exibir.innerHTML = `${nome}, vai jogar PlayStation!`
}
}





</script>




</body>
</html>
