<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEQUE ESPECIAL</title>
    <link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3e6/512.webp">
</head>
<body style="text-align: center;">
    <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3e6/512.webp" alt="Banco" style="width: 200px; height: 200px;">
    <h1 style = "background-color: darkblue; color: white; font-size: 30px;">CHEQUE ESPECIAL</H1>

<span style="color: blue; width: max-content; height: max-content; font-size: 150% ">Saldo da conta:</span>
<input type="text" id="ipt_saldo" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<span style="color: blue; width: max-content; height: max-content; font-size: 150% ">Valor do débito:</span>
<input type="text" id="ipt_debito" style="width: max-content; height: max-content; font-size: 150%"> <br> <br>
<button onclick="analisar_conta()" style="width: max-content; height: max-content; font-size: 250%;">Analisar conta</button>
<br><br><br>
<div id="div_exibir" style="font-size: 40px"></div>

<script>

function analisar_conta(){

let saldo = Number(ipt_saldo.value)
let debito = Number(ipt_debito.value)
let novo_saldo = saldo - debito

if (novo_saldo < 0){
    div_exibir.innerHTML = `<b style="color: red;">O saldo atual da conta corrente é ${novo_saldo}</b>`
} else{
    div_exibir.innerHTML = `O saldo atual da conta corrente é ${novo_saldo}`
}
}





</script>




</body>
</html>
