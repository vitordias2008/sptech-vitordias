<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 3</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">3. Primeira e Última letra</h1>

    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase"><br>

    <span>Digite uma palavra:</span>
    <input type="text" id="ipt_palavra"><br>

    <button class="button" onclick="analisar()">Analisar Frase</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function analisar() {
        let frase = ipt_frase.value
        let palavra = ipt_palavra.value

        if (frase.startsWith(palavra) && frase.endsWith(palavra)) {
            div_exibir.innerHTML = `A frase começa e termina com ${palavra}!`
        } else if (frase.startsWith(palavra)) {
            div_exibir.innerHTML = `A frase começa com ${palavra}!`
        } else if (frase.endsWith(palavra)) {
            div_exibir.innerHTML = `A frase termina com ${palavra}!`
        } else {
            div_exibir.innerHTML = `A frase não começa e nem termina com ${palavra}!`
        }
    }
</script>
