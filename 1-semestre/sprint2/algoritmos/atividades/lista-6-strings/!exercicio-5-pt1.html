<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 5</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">5. Substituidor de Caracteres</h1>

    <span>Digite uma senha:</span>
    <input type="text" id="ipt_senha" oninput="fortalecer()"><br>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function fortalecer() {
        let senha = ipt_senha.value

        senha = senha.replaceAll("a", "@")
        senha = senha.replaceAll("A", "@")
        senha = senha.replaceAll("e", "3")
        senha = senha.replaceAll("E", "3")

        div_exibir.innerHTML = `Senha mais forte: ${senha}`
    }
</script>
