<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 6</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">6. Observador de Índices</h1>

    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase" oninput="observar()"><br>

    <span>Qual posição deseja ver?</span>
    <input type="text" id="ipt_posicao" oninput="observar()"><br>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function observar() {
        let frase = ipt_frase.value
        let posicao = Number(ipt_posicao.value)

        let primeira = frase.charAt(0)
        let escolhida = frase.charAt(posicao - 1)
        let ultima = frase.charAt(frase.length - 1)

        div_exibir.innerHTML = `
            A primeira letra é: ${primeira}<br>
            A ${posicao}ª letra é: ${escolhida}<br>
            A última letra é: ${ultima}
        `
    }
</script>
