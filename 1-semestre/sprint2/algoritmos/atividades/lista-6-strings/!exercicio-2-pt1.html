<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 2</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">2. Detector de Palavras</h1>

    <span>Digite uma frase:</span>
    <input type="text" id="ipt_frase"><br>

    <button class="button" onclick="analisar()">Analisar Frase</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function analisar() {
        let frase = ipt_frase.value

        if (frase.includes("teste") || frase.includes("abc") || frase.includes("spam")) {
            div_exibir.innerHTML = `<span style="color: red">Frase Inválida</span>`
        } else {
            div_exibir.innerHTML = `<span style="color: green">Frase Válida!</span>`
        }
    }
</script>
