<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 1</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">1. Caça às Frutas</h1>

    <span>Digite uma fruta:</span>
    <input type="text" id="ipt_fruta"><br>

    <button class="button" onclick="pesquisar()">Pesquisar</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    let frutas = ["banana", "maçã", "uva", "morango", "laranja"]

    function pesquisar() {
        let fruta = ipt_fruta.value

        if (frutas.includes(fruta)) {
            div_exibir.innerHTML = `A fruta ${fruta} existe na lista.`
        } else {
            div_exibir.innerHTML = `Não existe a fruta ${fruta} na lista.`
        }
    }
</script>
