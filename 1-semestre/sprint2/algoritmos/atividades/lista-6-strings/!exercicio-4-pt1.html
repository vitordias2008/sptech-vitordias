<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 4</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-size: 30px;
            text-align: left;
        }

        span {
            font-size: 20px;
        }

        input, select {
            width: 200px;
            height: 30px;
            font-size: 18px;
            margin: 10px;
        }

        button {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
        }

        #div_exibir {
            font-size: 20px;
            margin-top: 20px;
        }

        .erro {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="body">
    <h1 class="h1">4. Comparador de Palavras</h1>

    <span>Digite a primeira palavra:</span>
    <input type="text" id="ipt_palavra1"><br>

    <span>Digite a segunda palavra:</span>
    <input type="text" id="ipt_palavra2"><br>

    <button class="button" onclick="analisar()">Analisar Palavras</button>

    <div class="button" id="div_exibir"></div>
</body>
</html>

<script>
    function analisar() {
        let palavra1 = ipt_palavra1.value
        let palavra2 = ipt_palavra2.value

        if (palavra1 == palavra2) {
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} são exatamente iguais!`
        } else if (palavra1.toLowerCase() == palavra2.toLowerCase()) {
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} possuem o mesmo conteúdo, mas a digitação é diferente (maiúsculas e minúsculas)`
        } else {
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} são completamente diferentes!`
        }
    }
</script>
